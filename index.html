<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Телекуч | Ресторан европейской кухни</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',

                extend: {
                    colors: {
                        gold: {
                            DEFAULT: '#D4AF37',
                            light: '#F3E5AB',
                            dark: '#AA8C2C',

                }
            }

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

</head>
<body class="bg-darkBg text-gray-100 min-h-screen selection:bg-gold selection:text-black pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-darkBg/80 border-b border-gray-800 transition-all">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-gold-dark via-gold to-gold-light flex items-center justify-center shadow-lg shadow-gold/20">
                    <i data-lucide="utensils" class="w-5 h-5 text-black"></i>
                </div>
                <div>
                    <h1 class="text-xl font-serif font-bold tracking-wider text-gold-light">ТЕЛЕКУЧ</h1>
                    <p class="text-xs text-gray-400 uppercase tracking-widest" data-i18n="subtitle">Европейская кухня</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Lang Switcher -->
                <div class="flex bg-cardBg border border-gray-700/60 rounded-full p-1 text-xs font-medium">
                    <button onclick="setLang('ru')" id="lang-ru" class="px-2.5 py-1 rounded-full transition-all bg-gold text-black font-semibold">RU</button>
                    <button onclick="setLang('kz')" id="lang-kz" class="px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-white">KZ</button>
                    <button onclick="setLang('en')" id="lang-en" class="px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-white">EN</button>
                </div>

                <!-- QR Modal Trigger -->
                <button onclick="openQRModal()" class="p-2.5 bg-cardBg border border-gray-700 hover:border-gold rounded-full text-gold transition-all shadow-md relative group">
                    <i data-lucide="qr-code" class="w-5 h-5"></i>
                </button>

                <!-- Waiter Call Button -->
                <button onclick="callWaiter()" class="p-2.5 bg-gold hover:bg-gold-light text-black rounded-full transition-all shadow-lg shadow-gold/20 flex items-center justify-center font-bold">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="max-w-4xl mx-auto px-4 pb-4">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterDishes()" placeholder="Поиск блюда или ингредиента..." 
                    class="w-full bg-cardBg border border-gray-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-gold transition-all">
            </div>
        </div>

        <!-- Categories Tabs -->
        <div class="max-w-4xl mx-auto px-4 pb-3 overflow-x-auto no-scrollbar flex space-x-2">
            <button onclick="filterCategory('all')" id="cat-all" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-gold text-black shadow-md">
                <span data-i18n="cat_all">Всё меню</span>
            </button>
            <button onclick="filterCategory('starters')" id="cat-starters" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-cardBg text-gray-300 hover:bg-cardHover border border-gray-800">
                <span data-i18n="cat_starters">Закуски</span>
            </button>
            <button onclick="filterCategory('mains')" id="cat-mains" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-cardBg text-gray-300 hover:bg-cardHover border border-gray-800">
                <span data-i18n="cat_mains">Основные блюда</span>
            </button>
            <button onclick="filterCategory('desserts')" id="cat-desserts" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-cardBg text-gray-300 hover:bg-cardHover border border-gray-800">
                <span data-i18n="cat_desserts">Десерты</span>
            </button>
            <button onclick="filterCategory('drinks')" id="cat-drinks" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-cardBg text-gray-300 hover:bg-cardHover border border-gray-800">
                <span data-i18n="cat_drinks">Напитки</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 pt-6">
        <div id="dishesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Dishes injected via JS -->
        </div>
        <div id="noResults" class="hidden text-center py-16">
            <i data-lucide="search-x" class="w-12 h-12 text-gray-600 mx-auto mb-3"></i>
            <p class="text-gray-400" data-i18n="no_results">Ничего не найдено по вашему запросу</p>
        </div>
    </main>

    <!-- Footer Action Bar -->

            <div class="flex items-center space-x-2 text-xs text-gray-400">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span data-i18n="table_num">Стол №4 • Ресторан Телекуч</span>
            </div>
            <button onclick="openBookingModal()" class="px-4 py-2 bg-gradient-to-r from-gold-dark to-gold text-black rounded-xl font-semibold text-xs tracking-wide shadow-lg shadow-gold/10 hover:opacity-90 transition-all flex items-center space-x-1.5">

                <span data-i18n="book_table">Бронь стола</span>
            </button>
        </div>
    </footer>

    <!-- Modal Dish Details -->
    <div id="dishModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-800 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeDishModal()" class="absolute top-3 right-3 z-10 p-2 bg-black/60 backdrop-blur-md rounded-full text-white hover:bg-black transition-all">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            </div>

                </div>

    </div>

    <!-- QR Code Modal -->

            <button onclick="closeQRModal()" class="absolute top-3 right-3 p-2 bg-gray-800 rounded-full text-white hover:bg-gray-700 transition-all">

            </button>
            <h3 class="text-xl font-serif font-bold text-gold mb-1" data-i18n="qr_title">Меню по QR-коду</h3>
            <p class="text-xs text-gray-400 mb-6" data-i18n="qr_subtitle">Сканируйте камеру телефона для доступа к меню</p>
            <div class="bg-white p-4 rounded-2xl inline-block shadow-lg mb-6">
                <canvas id="qrcodeCanvas"></canvas>
            </div>
            <button onclick="downloadQR()" class="w-full py-3 bg-gold hover:bg-gold-light text-black font-semibold rounded-xl text-sm transition-all shadow-lg shadow-gold/20 flex items-center justify-center space-x-2">

        </div>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="closeBookingModal()" class="absolute top-3 right-3 p-2 bg-gray-800 rounded-full text-white hover:bg-gray-700 transition-all">

            <p class="text-xs text-gray-400 mb-6" data-i18n="booking_subtitle">Зарезервируйте лучший столик в ресторане Телекуч</p>

                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1" data-i18n="book_phone">Номер телефона</label>

                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1" data-i18n="book_date">Дата</label>
                        <input type="date" required class="w-full bg-darkBg border border-gray-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1" data-i18n="book_time">Время</label>
                        <input type="time" required class="w-full bg-darkBg border border-gray-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-gold">
                    </div>
                </div>
                <button type="submit" class="w-full py-3 bg-gold hover:bg-gold-light text-black font-semibold rounded-xl text-sm transition-all shadow-lg shadow-gold/20 mt-2" data-i18n="book_submit">Забронировать</button>

        </div>
    </div>

        let activeCategory = 'all';

        function renderDishes() {
            const grid = document.getElementById('dishesGrid');
            const noResults = document.getElementById('noResults');
            const query = document.getElementById('searchInput').value.toLowerCase();

            grid.innerHTML = '';

            const filtered = dishes.filter(dish => {
                const matchesCat = activeCategory === 'all' || dish.category === activeCategory;
                const name = dish.name[currentLang].toLowerCase();
                const desc = dish.desc[currentLang].toLowerCase();
                const ingredients = dish.ingredients[currentLang].join(' ').toLowerCase();
                const matchesQuery = name.includes(query) || desc.includes(query) || ingredients.includes(query);
                return matchesCat && matchesQuery;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            filtered.forEach(dish => {
                const card = document.createElement('div');
                card.className = 'bg-cardBg border border-gray-800/80 rounded-2xl overflow-hidden hover:border-gold/50 transition-all duration-300 flex flex-col justify-between shadow-lg group cursor-pointer';
                card.onclick = () => openDishModal(dish.id);

                card.innerHTML = `
                    <div>
                        <div class="relative h-48 w-full overflow-hidden">
                            <img src="${dish.image}" alt="${dish.name[currentLang]}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-transparent"></div>
                            <div class="absolute top-3 left-3 flex gap-1.5">
                                <span class="px-2.5 py-1 bg-black/60 backdrop-blur-md text-gold text-[10px] font-bold rounded-lg border border-gold/20 shadow">${dish.badge[currentLang]}</span>
                            </div>
                            <div class="absolute top-3 right-3">
                                <span class="px-2.5 py-1 bg-black/70 backdrop-blur-md text-white text-xs font-mono rounded-lg border border-gray-700">${dish.weight}</span>
                            </div>
                        </div>
                        <div class="p-5">
                            <h3 class="text-lg font-serif font-bold text-white mb-1.5 group-hover:text-gold transition-colors">${dish.name[currentLang]}</h3>
                            <p class="text-xs text-gray-400 line-clamp-2 mb-4 leading-relaxed">${dish.desc[currentLang]}</p>
                            <div class="flex flex-wrap gap-1 mb-2">
                                ${dish.ingredients[currentLang].slice(0, 3).map(ing => `<span class="text-[10px] bg-darkBg text-gray-300 px-2 py-0.5 rounded border border-gray-800">${ing}</span>`).join('')}
                                ${dish.ingredients[currentLang].length > 3 ? `<span class="text-[10px] bg-darkBg text-gray-500 px-1.5 py-0.5 rounded">+${dish.ingredients[currentLang].length - 3}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-gray-800/60 mt-auto">
                        <span class="text-xs text-gray-400 italic" data-i18n="click_details">Нажмите для деталей</span>
                        <span class="text-lg font-bold text-gold">${dish.price}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-cardBg text-gray-300 hover:bg-cardHover border border-gray-800";
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-gold text-black shadow-md";
            }
            renderDishes();
        }

        function filterDishes() {
            renderDishes();
        }

        function setLang(lang) {
            currentLang = lang;
            ['ru', 'kz', 'en'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (l === lang) {
                    btn.className = "px-2.5 py-1 rounded-full transition-all bg-gold text-black font-semibold";
                } else {
                    btn.className = "px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-white";
                }
            });

            // Update static strings
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            
            // Update placeholders
            document.getElementById('searchInput').placeholder = lang === 'ru' ? 'Поиск блюда или ингредиента...' : lang === 'kz' ? 'Тағамды немесе ингредиентті іздеу...' : 'Search dish or ingredient...';

            renderDishes();
        }

        // Modal Dish
        function openDishModal(id) {
            const dish = dishes.find(d => d.id === id);
            if (!dish) return;

            document.getElementById('modalImg').src = dish.image;
            document.getElementById('modalBadge').innerText = dish.badge[currentLang];
            document.getElementById('modalTitle').innerText = dish.name[currentLang];
            document.getElementById('modalWeight').innerText = dish.weight;
            document.getElementById('modalDesc').innerText = dish.desc[currentLang];
            document.getElementById('modalPrice').innerText = dish.price;

            const ingContainer = document.getElementById('modalIngredients');
            ingContainer.innerHTML = dish.ingredients[currentLang].map(ing => `<span class="text-xs bg-darkBg text-gold px-2.5 py-1 rounded-lg border border-gray-800">${ing}</span>`).join('');

            document.getElementById('dishModal').classList.remove('hidden');
        }

        function closeDishModal() {
            document.getElementById('dishModal').classList.add('hidden');
        }

        // QR Modal
        let qrInstance = null;
        function openQRModal() {
            document.getElementById('qrModal').classList.remove('hidden');
            if (!qrInstance) {
                qrInstance = new QRious({
                    element: document.getElementById('qrcodeCanvas'),
                    value: window.location.href,
                    size: 180,
                    level: 'H',
                    background: '#ffffff',
                    foreground: '#121212'
                });
            }
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        function downloadQR() {
            const canvas = document.getElementById('qrcodeCanvas');
            const link = document.createElement('a');
            link.download = 'telekuch-menu-qr.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Booking Modal
        function openBookingModal() {
            document.getElementById('bookingModal').classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('bookingModal').classList.add('hidden');
        }

        function handleBooking(e) {
            e.preventDefault();
            closeBookingModal();
            showToast(translations[currentLang].booking_success);
        }

        function callWaiter() {
            showToast(translations[currentLang].waiter_called);
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = text;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Init
        window.onload = () => {
            renderDishes();
            lucide.createIcons();
        };
    </script>
</body>
</html>
